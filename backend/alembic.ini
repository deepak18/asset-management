# Alembic configuration.
#
# NOTE: `sqlalchemy.url` is intentionally left blank. The URL is provided at
# runtime by migrations/env.py, which reads it from the app's typed Settings
# (app.core.config). This keeps a single configuration source of truth and keeps
# DB credentials out of version control.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging (standard Alembic setup)
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


